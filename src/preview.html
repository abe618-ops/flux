<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文版预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .toolbar .title { font-weight: 600; font-size: 14px; margin-right: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      padding: 8px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #1f2937;
    }
    button:hover { border-color: #2563eb; color: #2563eb; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.primary:hover { background: #1d4ed8; color: #fff; }
    .note { font-size: 12px; color: #6b7280; }
    .frame-wrap {
      max-width: 860px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      min-height: 80vh;
      border: none;
      display: block;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .empty { text-align: center; padding: 80px 20px; color: #6b7280; }
    .empty button { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="title" id="pageTitle">图文版预览</span>
    <button id="copyHtmlBtn">复制 HTML 源码</button>
    <button id="mailTextBtn">发送纯文本版到邮箱</button>
    <button id="evernoteTextBtn">发送纯文本版到印象笔记</button>
    <a id="originalLink" href="#" target="_blank" rel="noopener"><button>打开原文</button></a>
    <span class="note">提示：mailto 携带的是纯文本。完整 HTML 图文版请复制源码，粘贴到支持 HTML 的邮件编辑器（或接入 EmailJS 后端通道）发送。</span>
  </div>

  <div class="frame-wrap">
    <div class="empty" id="emptyState" hidden>
      <p>没有待预览的内容。</p>
      <button id="backBtn">返回</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-same-origin" title="图文版预览"></iframe>
  </div>

  <div class="toast" id="toast"></div>

  <script src="preview.js"></script>
</body>
</html>
