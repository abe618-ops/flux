name: Build Ceshu Yingqi V3 Android
on:
  push:
    branches: [ research/ceshu-yingqi-v3-20261019 ]
    paths: [ 'ceshu-yingqi-v3/**', '.github/workflows/ceshu-yingqi-v3-android.yml' ]
  workflow_dispatch:
  pull_request:
    paths: [ 'ceshu-yingqi-v3/**', '.github/workflows/ceshu-yingqi-v3-android.yml' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: ceshu-yingqi-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check pure Java engine
        run: |
          mkdir -p build/ceshu-core-check
          javac -encoding UTF-8 -d build/ceshu-core-check app/src/main/java/com/abe618/ceshuyingqi/CeshuCore.java app/src/main/java/com/abe618/ceshuyingqi/CeshuCoreSelfTest.java
          java -cp build/ceshu-core-check com.abe618.ceshuyingqi.CeshuCoreSelfTest
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CeshuYingqi-V3-debug-apk
          path: ceshu-yingqi-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
