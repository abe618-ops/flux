name: Build DaLiuRen DualPan v1

on:
  push:
    branches: [ "feature/daliuren-dual-pan-v1" ]
    paths:
      - "android/daliuren-dual-pan-v1/**"
      - ".github/workflows/build-liuren-dual-pan-v1.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Expand project source
        run: |
          cd "$RUNNER_TEMP"
          base64 -d "$GITHUB_WORKSPACE/android/daliuren-dual-pan-v1/project.tar.gz.b64" > project.tgz
          tar -xzf project.tgz
          test -f daliuren_dual_pan_v1/app/build.gradle
          echo "PROJECT=$RUNNER_TEMP/daliuren_dual_pan_v1" >> "$GITHUB_ENV"

      - name: Import Apache-2.0 DaLiuRen engine
        run: |
          git clone --depth 1 https://github.com/woaiys3/pusuan-agent.git "$RUNNER_TEMP/pusuan-agent"
          mkdir -p "$PROJECT/app/src/main/assets/app/engine" "$PROJECT/app/src/main/assets/app/js" "$PROJECT/app/src/main/assets/licenses"
          cp "$RUNNER_TEMP/pusuan-agent/assets/app/engine/liuren/lrpp.js" "$PROJECT/app/src/main/assets/app/engine/lrpp.js"
          cp "$RUNNER_TEMP/pusuan-agent/assets/app/engine/liuren/nongli.js" "$PROJECT/app/src/main/assets/app/engine/nongli.js"
          cp "$RUNNER_TEMP/pusuan-agent/assets/app/engine/liuren/tys_20230527.js" "$PROJECT/app/src/main/assets/app/engine/tys_20230527.js"
          cp "$RUNNER_TEMP/pusuan-agent/assets/app/js/engine/liuren.js" "$PROJECT/app/src/main/assets/app/js/liuren.js"
          cp "$RUNNER_TEMP/pusuan-agent/LICENSE" "$PROJECT/app/src/main/assets/licenses/pusuan-agent-LICENSE.txt"
          test -s "$PROJECT/app/src/main/assets/app/engine/lrpp.js"

      - name: Add structured adapter and dual layout patch
        run: |
          cat > "$PROJECT/app/src/main/assets/app/engine-adapter.js" <<'JS'
          (function(){
            'use strict';
            if(!window.LiurenEngine || typeof window.LiurenEngine.paipan!=='function') return;
            const raw=window.LiurenEngine.paipan.bind(window.LiurenEngine);
            const codes={子:'zi',丑:'chou',寅:'yin',卯:'mao',辰:'chen',巳:'si',午:'wu',未:'wei',申:'shen',酉:'you',戌:'xu',亥:'hai'};
            const gname={贵:'贵人',蛇:'螣蛇',雀:'朱雀',合:'六合',勾:'勾陈',青:'青龙',龙:'青龙',空:'天空',虎:'白虎',常:'太常',玄:'玄武',阴:'太阴',后:'天后'};
            function parseStars(x,z){
              const c=codes[z], out=[];
              try{
                const v=(x.G12fx||{})[c+'_gongxq'];
                const o=typeof v==='string'?JSON.parse(v):v;
                let s=String((o||{}).shensha||'').replace(/^.*?作[:：]/,'');
                s.split(/[、,，]/).map(v=>v.trim()).filter(Boolean).forEach(v=>out.push(v));
              }catch(e){}
              if(!out.length){
                const a=(x.cyss||{})['sszx_'+c];
                if(Array.isArray(a)) a.forEach(v=>out.push(v));
              }
              return out;
            }
            function adapt(x){
              x=x||{};
              const h={
                年柱:x.sz_ar_y||((x.sz_ar_yg||'')+(x.sz_ar_yz||'')),
                月柱:x.sz_ar_m||((x.sz_ar_mg||'')+(x.sz_ar_mz||'')),
                日柱:x.sz_ar_d||((x.sz_ar_dg||'')+(x.sz_ar_dz||'')),
                时柱:x.sz_ar_h||((x.sz_ar_hg||'')+(x.sz_ar_hz||'')),
                月将:x.sj_yuejiang||'',
                节气:String(x.sj_nl||'').trim().split(/\s+/).pop()||'',
                初传:(x.SC||{}).sc_c||'',
                中传:(x.SC||{}).sc_z||'',
                末传:(x.SC||{}).sc_m||'',
                一课:'',
                二课:'',
                三课:'',
                四课:'',
                宫位:{},
                神煞:{}
              };
              const sk=x.SK||{};
              for(let i=1;i<=4;i++){
                h[['','一课','二课','三课','四课'][i]]=[sk['sk_'+i+'s'],sk['sk_'+i+'t'],sk['sk_'+i+'d']].filter(Boolean).join(' ');
              }
              Object.keys(codes).forEach(z=>{
                const c=codes[z], tp=x.TP||{}, dg=x.TP_DG||{}, sp=x.SP||{};
                const sky=tp['td_'+c+'t']||z, stem=(dg['td_'+c+'dg']||'').trim(), g=(sp['td_'+c+'s']||'').trim();
                h.宫位[z]={地盘:z,天盘:sky,遁干:stem,天将:z+(gname[g]||g||'')};
                h.神煞[z]={};
                parseStars(x,z).forEach(s=>{h.神煞[z][s]=z});
              });
              return Object.assign(h,x);
            }
            window.LiurenEngine.paipan=function(params){return adapt(raw(params))};
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          root=Path(__import__('os').environ['PROJECT'])/'app/src/main/assets/app'
          idx=root/'index.html'
          s=idx.read_text()
          if 'engine-adapter.js' not in s:
              s=s.replace('<script src="app.js"></script>','<script src="engine-adapter.js"></script>\n  <script src="app.js"></script>')
          idx.write_text(s)

          p=root/'app.js'
          s=p.read_text()
          old="""const PALACES=[
            ['巳',1,1],['午',1,2],['未',1,3],['申',1,4],
            ['辰',2,1],['酉',2,4],['卯',3,1],['戌',3,4],
            ['寅',4,1],['丑',4,2],['子',4,3],['亥',4,4]
          ];"""
          new="""const PALACES=[
            ['申',1,1],['酉',1,2],['戌',1,3],['亥',1,4],
            ['未',2,1],['子',2,4],['午',3,1],['丑',3,4],
            ['巳',4,1],['辰',4,2],['卯',4,3],['寅',4,4]
          ];
          const MOVE_PALACES=[
            ['巳',1,1],['午',1,2],['未',1,3],['申',1,4],
            ['辰',2,1],['酉',2,4],['卯',3,1],['戌',3,4],
            ['寅',4,1],['丑',4,2],['子',4,3],['亥',4,4]
          ];"""
          if old not in s:
              raise SystemExit('PALACES block not found')
          s=s.replace(old,new,1)
          s=s.replace('function palaceCenter(z){const p=PALACES.find','function palaceCenter(z){const p=MOVE_PALACES.find',1)
          marker='function renderMove(){'
          i=s.index(marker)
          head,tail=s[:i],s[i:]
          tail=tail.replace('for(const [z,r,c] of PALACES)','for(const [z,r,c] of MOVE_PALACES)',1)
          p.write_text(head+tail)
          PY

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DaLiuRen-DualPan-Shensha-Yunyi-v1.0.0.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/六壬双盘-神煞运移-v1.0.0.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Verify APK
        run: |
          APK="$PROJECT/dist/DaLiuRen-DualPan-Shensha-Yunyi-v1.0.0.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 10

      - name: Package source snapshot
        run: |
          cd "$RUNNER_TEMP"
          zip -qr "$PROJECT/dist/DaLiuRen-DualPan-Shensha-Yunyi-v1.0.0-source.zip" daliuren_dual_pan_v1

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: DaLiuRen-DualPan-v1.0.0
          path: |
            ${{ env.PROJECT }}/dist/*
          if-no-files-found: error
          retention-days: 30
