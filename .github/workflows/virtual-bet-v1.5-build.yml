name: Virtual Bet v1.5 Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'virtual-bet-v1.5.0/source.b64.*'
      - '.github/workflows/virtual-bet-v1.5-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact v1.5.0 source archive
        shell: bash
        run: |
          cat virtual-bet-v1.5.0/source.b64.* | tr -d '[:space:]' | base64 -d > /tmp/virtual-bet-source.zip
          unzip -t /tmp/virtual-bet-source.zip
          mkdir -p /tmp/virtual-bet-src
          unzip -q /tmp/virtual-bet-source.zip -d /tmp/virtual-bet-src
          PROJECT_DIR="$(find /tmp/virtual-bet-src -maxdepth 1 -type d -name 'football-simulator-*' | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -q "versionName '1.5.0-caidian-auto-settle'" "$PROJECT_DIR/app/build.gradle"
          grep -q 'ResultJob' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee /tmp/SHA256.txt
          cp "$APK" /tmp/VirtualBet-v1.5.0-caidian-auto-settle-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualBet-v1.5.0-debug
          path: |
            /tmp/VirtualBet-v1.5.0-caidian-auto-settle-debug.apk
            /tmp/SHA256.txt
          if-no-files-found: error
