name: Build Football Fusion Resonance APK

on:
  push:
    branches:
      - 'football-fusion/**'
    paths:
      - 'football-fusion-resonance-v1.1/**'
      - '.github/workflows/football-fusion-resonance-build.yml'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android signing tools
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Reconstruct packaged inputs
        shell: bash
        run: |
          cat football-fusion-resonance-v1.1/payload/base-apk.*.b64part | base64 -d > football-fusion-resonance-v1.1/football-fusion-resonance-v1.1-unsigned.apk
          cat football-fusion-resonance-v1.1/payload/debug-jks.*.b64part | base64 -d > football-fusion-resonance-v1.1/football-fusion-debug.jks
          unzip -t football-fusion-resonance-v1.1/football-fusion-resonance-v1.1-unsigned.apk | tail -2

      - name: Align and sign APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC="football-fusion-resonance-v1.1/football-fusion-resonance-v1.1-unsigned.apk"
          ALIGNED="football-fusion-resonance-v1.1/dist/football-fusion-resonance-v1.1-aligned.apk"
          OUT="football-fusion-resonance-v1.1/dist/football-fusion-resonance-v1.1.apk"
          mkdir -p football-fusion-resonance-v1.1/dist
          "$BT/zipalign" -p -f 4 "$SRC" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks football-fusion-resonance-v1.1/football-fusion-debug.jks \
            --ks-key-alias fusion \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-fusion-resonance-v1.1-apk
          path: football-fusion-resonance-v1.1/dist/football-fusion-resonance-v1.1.apk
          if-no-files-found: error
          retention-days: 30
