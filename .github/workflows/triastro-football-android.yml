name: Build TriAstro Football Android

on:
  push:
    branches: [ main, 'triastro/**' ]
    paths:
      - 'astro-football-lab/**'
      - '.github/workflows/triastro-football-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: astro-football-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 36 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../TriAstroFootball-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TriAstroFootball-v1.0-debug-apk
          path: TriAstroFootball-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
