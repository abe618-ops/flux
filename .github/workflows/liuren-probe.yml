name: Probe Liuren Engine

on:
  push:
    branches: [ "feature/daliuren-dual-pan-v1" ]
    paths:
      - ".github/workflows/liuren-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source engine
        run: |
          git clone --depth 1 https://github.com/woaiys3/pusuan-agent.git /tmp/pusuan
      - name: Probe engine result
        run: |
          cat > /tmp/probe.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const base='/tmp/pusuan/assets/app/engine/liuren';
          const ctx={console, Date, Math, JSON, setTimeout, clearTimeout};
          ctx.window=ctx; ctx.globalThis=ctx;
          vm.createContext(ctx);
          for (const f of ['nongli.js','tys_20230527.js','lrpp.js']) {
            vm.runInContext(fs.readFileSync(base+'/'+f,'utf8'), ctx, {filename:f});
          }
          const params={zhs:'正时',grxz:'甲戊庚牛羊',zygr:'自动选择',sex:'男',age:18,glzxyj:'中气换将',shehai:'孟仲季',dt:{y:2026,m:9,d:22,h:6,i:10}};
          const out=ctx.setup(params);
          console.log('OUT_KEYS', Object.keys(out||{}));
          console.log('RESULT_KEYS', Object.keys((out||{}).result||{}));
          console.log('RESULT_SAMPLE', JSON.stringify((out||{}).result,null,2).slice(0,50000));
          NODE
          node /tmp/probe.js
