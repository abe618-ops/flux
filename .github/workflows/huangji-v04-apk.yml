name: Build HuangJi GuaShu v0.4 APK
on:
  push:
    branches: [feature/huangji-v04-apk]
    paths:
      - 'apps/huangji-gua/**'
      - '.github/workflows/huangji-v04-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: apps/huangji-gua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 using runner preinstalled sdkmanager
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Confirm offline assets are included
        run: |
          test -s app/src/main/assets/index.html
          python3 -c 'from pathlib import Path; s=Path("app/src/main/assets/index.html").read_text(encoding="utf-8"); assert "<html" in s and "皇极卦数" in s; print("HTML chars:", len(s))'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: huangji-v04-debug-apk
          path: apps/huangji-gua/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
