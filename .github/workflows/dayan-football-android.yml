name: Build Dayan Goal Parity Android

on:
  push:
    branches: [ dayan-goal-parity-v1 ]
    paths:
      - 'dayan-football/**'
      - '.github/workflows/dayan-football-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dayan-goal-parity-v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 36 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        working-directory: dayan-football
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="dayan-football/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/DayanFootball-GoalParity-v1.0-debug.apk"
          sha256sum "dist/DayanFootball-GoalParity-v1.0-debug.apk" > "dist/DayanFootball-GoalParity-v1.0-SHA256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayanFootball-GoalParity-v1.0-debug-apk
          path: |
            dist/DayanFootball-GoalParity-v1.0-debug.apk
            dist/DayanFootball-GoalParity-v1.0-SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit built APK to branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/DayanFootball-GoalParity-v1.0-debug.apk dist/DayanFootball-GoalParity-v1.0-SHA256.txt
          git commit -m "Build goal parity APK" || exit 0
          git push origin HEAD:dayan-goal-parity-v1
