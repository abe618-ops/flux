name: FLUX Sports Study Android
on:
  workflow_dispatch:
  push:
    paths:
      - '体育/**'
      - '.github/workflows/sports-study-build.yml'
  pull_request:
    paths:
      - '体育/**'
      - '.github/workflows/sports-study-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: 体育
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-SportsStudy-debug
          path: 体育/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
