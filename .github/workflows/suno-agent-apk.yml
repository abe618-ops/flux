name: Build Suno Agent APK

on:
  push:
    branches: ["suno-agent-v1-build"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suno-agent-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Suno-Agent-V1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Suno-Agent-V1
          path: suno-agent-android/Suno-Agent-V1.apk
          if-no-files-found: error
