name: P3P5 Fast Check Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'p3p5-fast-check/source.zip'
      - '.github/workflows/p3p5-fast-check-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore source project
        shell: bash
        run: |
          rm -rf /tmp/p3p5-fast-check-src
          mkdir -p /tmp/p3p5-fast-check-src
          unzip -q p3p5-fast-check/source.zip -d /tmp/p3p5-fast-check-src
          PROJECT_DIR="/tmp/p3p5-fast-check-src/p3p5-fast-check-src"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Refresh bundled P3/P5 history snapshot
        shell: bash
        run: |
          set +e
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"
          fetch_history() {
            file="$1"
            out="$2"
            tmp="/tmp/$file"
            rm -f "$tmp"
            curl -fL --retry 3 --connect-timeout 10 --max-time 60 "https://data.17500.cn/$file" -o "$tmp" \
              || curl -fL --retry 2 --connect-timeout 10 --max-time 60 "http://data.17500.cn/$file" -o "$tmp"
            if [ -s "$tmp" ] && [ "$(wc -l < "$tmp")" -gt 100 ]; then
              cp "$tmp" "$out"
              echo "$file snapshot refreshed: $(wc -l < "$tmp") lines"
            else
              echo "$file refresh unavailable; keeping bundled fallback"
            fi
          }
          fetch_history pl3_desc.txt "$ASSETS/pl3_desc.txt"
          fetch_history pl5_desc.txt "$ASSETS/pl5_desc.txt"
          set -e

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12
          cp "$APK" /tmp/P3P5-FastCheck-v0.1.0-debug.apk
          sha256sum /tmp/P3P5-FastCheck-v0.1.0-debug.apk | tee /tmp/P3P5-FastCheck-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P3P5-FastCheck-v0.1.0-debug
          path: |
            /tmp/P3P5-FastCheck-v0.1.0-debug.apk
            /tmp/P3P5-FastCheck-SHA256.txt
          if-no-files-found: error
