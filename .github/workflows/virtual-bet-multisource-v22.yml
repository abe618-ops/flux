name: Build VirtualBet MultiSource v2.2
on:
  push:
    branches: [ main ]
    paths:
      - 'virtual-bet-multisource-v2.2/**'
      - '.github/workflows/virtual-bet-multisource-v22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: virtual-bet-multisource-v2.2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify package signature alignment
        shell: bash
        run: |
          APK=virtual-bet-multisource-v2.2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.flux.virtualbet.multisource'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Publish APK
        shell: bash
        run: |
          mkdir -p dist
          cp virtual-bet-multisource-v2.2/app/build/outputs/apk/debug/app-debug.apk dist/VirtualBet-MultiSource-v2.2-coexist.apk
          sha256sum dist/VirtualBet-MultiSource-v2.2-coexist.apk | tee dist/VirtualBet-MultiSource-v2.2-coexist.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualBet-MultiSource-v2.2-coexist
          path: |
            dist/VirtualBet-MultiSource-v2.2-coexist.apk
            dist/VirtualBet-MultiSource-v2.2-coexist.apk.sha256
          retention-days: 30
      - name: Commit APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/VirtualBet-MultiSource-v2.2-coexist.apk dist/VirtualBet-MultiSource-v2.2-coexist.apk.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build VirtualBet MultiSource v2.2 coexist APK"
          git push origin HEAD:main
