name: Build Football Predictor APK

on:
  push:
    branches:
      - build/football-predictor-apk-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 34 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Reconstruct and repair source
        run: |
          mkdir -p buildsrc
          cat builds/football-predictor/chunks/0*.b64 > /tmp/source.tar.gz.b64
          test "$(wc -c < /tmp/source.tar.gz.b64)" -eq 25692
          echo "f427eb549b9f10510c7d8387b18d812f039cfc2ce936f070679ce98ac6e47bbf  /tmp/source.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/source.tar.gz.b64 > /tmp/source.tar.gz
          echo "2e4f81a4979927721c8959f3979f34cb8dd4a4b7551b9b8884b0c6475fb0f55d  /tmp/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C buildsrc
          find buildsrc/app/src/main/res -type f -name '*.xml' -exec sed -i 's#http://schemas.android.com/apk/res/app#http://schemas.android.com/apk/res-auto#g' {} +

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p out
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk out/FootballPredictor-v1.0-debug.apk
          sha256sum out/FootballPredictor-v1.0-debug.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictor-APK
          path: out/*
          if-no-files-found: error
