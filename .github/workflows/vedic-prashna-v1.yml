name: Build Vedic Prashna Android APK

on:
  push:
    branches:
      - feature/vedic-prashna-football-v1
    paths:
      - 'vedic-prashna-android/**'
      - '.github/workflows/vedic-prashna-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: vedic-prashna-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VedicPrashnaFootball-v0.1.0-debug
          path: vedic-prashna-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
