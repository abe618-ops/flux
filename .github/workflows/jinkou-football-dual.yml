name: Build Jinkou Football Dual APK
on:
  push:
    paths:
      - 'jinkou-football-dual/**'
      - '.github/workflows/jinkou-football-dual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jinkou-football-dual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK in repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/JinkouFootballDual-v1.0-debug.apk
          sha256sum releases/JinkouFootballDual-v1.0-debug.apk > releases/JinkouFootballDual-v1.0-debug.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Jinkou football dual APK [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JinkouFootballDual-v1.0
          path: jinkou-football-dual/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
