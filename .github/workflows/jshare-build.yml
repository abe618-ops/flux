name: Build JShare APK

on:
  push:
    branches: [main]
    paths:
      - 'minimal-share/**'
      - '.github/workflows/jshare-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jshare-debug-keystore-v1

      - name: Build debug APK
        working-directory: minimal-share
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jshare-v0.1.0-debug
          path: minimal-share/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK into repository
        run: |
          mkdir -p dist/jshare
          cp minimal-share/app/build/outputs/apk/debug/app-debug.apk dist/jshare/JShare-v0.1.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/jshare/JShare-v0.1.0-debug.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(jshare): publish v0.1.0 debug apk"
          git push
