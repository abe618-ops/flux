name: Henan Scratch Lab Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/henan-scratch-lab-v1
      - main
    paths:
      - 'henan-scratch-lab/**'
      - '.github/workflows/henan-scratch-lab-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p henan-scratch-lab assembleDebug
      - name: Validate APK
        run: |
          APK=henan-scratch-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          cp "$APK" HenanScratchLab-v1.0.0-beta1-debug.apk
          sha256sum HenanScratchLab-v1.0.0-beta1-debug.apk > HenanScratchLab-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HenanScratchLab-v1.0.0-beta1
          path: |
            HenanScratchLab-v1.0.0-beta1-debug.apk
            HenanScratchLab-SHA256.txt
          if-no-files-found: error
