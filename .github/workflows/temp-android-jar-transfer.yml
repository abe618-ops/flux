name: Temp Android Jar Transfer

on:
  push:
    paths:
      - ".github/workflows/temp-android-jar-transfer.yml"

permissions:
  contents: read

jobs:
  fetch-android-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          ls -lh "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" android.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-35-jar
          path: android.jar
          retention-days: 1
