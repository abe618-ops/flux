name: Build ZiZhan WenWang LingQi APK
on:
  workflow_dispatch:
  push:
    branches: [ "zi-football-ui-v2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZiZhan-WenWang-LingQi-v1.1.0.apk
          zip -qr ZiZhan-WenWang-LingQi-source-v1.1.0.zip app build.gradle settings.gradle ZIZHAN_README.md .github/workflows/zizhan-football-build.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ZiZhan-WenWang-LingQi-v1.1.0
          path: |
            ZiZhan-WenWang-LingQi-v1.1.0.apk
            ZiZhan-WenWang-LingQi-source-v1.1.0.zip
          if-no-files-found: error
