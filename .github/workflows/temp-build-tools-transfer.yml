name: Temp Android Build Tools Transfer

on:
  push:
    paths:
      - ".github/workflows/temp-build-tools-transfer.yml"

permissions:
  contents: read

jobs:
  fetch-build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install Android Build Tools 35
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" build-tools-35.0.0
          du -sh build-tools-35.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: build-tools-35.0.0
          retention-days: 1
