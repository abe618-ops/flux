name: Build Football Fusion v1.4 APK

on:
  push:
    branches: [ 'football-fusion/v1.4-triad' ]
    paths:
      - 'football-fusion-v1.3/**'
      - '.github/workflows/football-fusion-v14-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: football-fusion-v1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 36 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify package and APK Signature Scheme v2+
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -8
          mkdir -p dist
          cp "$APK" dist/football-fusion-v1.4-triad.apk
          sha256sum dist/football-fusion-v1.4-triad.apk | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-fusion-v1.4-triad-apk
          path: |
            football-fusion-v1.3/dist/football-fusion-v1.4-triad.apk
            football-fusion-v1.3/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
