name: Build Fusion Lab v1.4.1 O/U Fix

on:
  push:
    branches: [ "lab/v14-three-stage-consensus" ]
    paths:
      - "fusion-lab-v14-three-button/source-overlay/**"
      - ".github/workflows/fusion-lab-v14-three-button-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lab/v14-three-stage-consensus

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v1.3 base source
        shell: bash
        run: |
          rm -rf /tmp/fusion-v14-build
          mkdir -p /tmp/fusion-v14-build
          base64 -d fusion-lab-v13fix/source.zip.b64 > /tmp/fusion-v13-source.zip
          unzip -q /tmp/fusion-v13-source.zip -d /tmp/fusion-v14-build
          test -f /tmp/fusion-v14-build/fusion_src/settings.gradle
          test -f /tmp/fusion-v14-build/fusion_src/app/src/main/assets/app.js

      - name: Apply v1.4 three-button overlay
        shell: bash
        run: |
          SRC=/tmp/fusion-v14-build/fusion_src
          cp fusion-lab-v14-three-button/source-overlay/index.html "$SRC/app/src/main/assets/index.html"
          cp fusion-lab-v14-three-button/source-overlay/style.css "$SRC/app/src/main/assets/style.css"
          cp fusion-lab-v14-three-button/source-overlay/app.js "$SRC/app/src/main/assets/app.js"
          cp fusion-lab-v14-three-button/source-overlay/app-build.gradle "$SRC/app/build.gradle"
          cp fusion-lab-v14-three-button/source-overlay/AndroidManifest.xml "$SRC/app/src/main/AndroidManifest.xml"
          grep -q "com.abe618.footballfusion.v14oufix" "$SRC/app/build.gradle"
          grep -q "三轮合参·大小修复" "$SRC/app/src/main/AndroidManifest.xml"
          grep -q "三者共同指向" "$SRC/app/src/main/assets/app.js"

      - name: Build debug APK
        working-directory: /tmp/fusion-v14-build/fusion_src
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify package, signature and alignment
        shell: bash
        run: |
          APK=/tmp/fusion-v14-build/fusion_src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.abe618.footballfusion.v14oufix'" /tmp/badging.txt
          grep -q "application-label:'三轮合参·大小修复'" /tmp/badging.txt

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p dist
          cp /tmp/fusion-v14-build/fusion_src/app/build/outputs/apk/debug/app-debug.apk             dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk
          sha256sum dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk             > dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionLab-v1.4.1-ThreeStage-OUFix-coexist
          path: |
            dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk
            dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk                   dist/FusionLab-v1.4.1-ThreeStage-OUFix-coexist.apk.sha256
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Fusion Lab v1.4.1 O/U-fix coexist APK"
            git push origin HEAD:lab/v14-three-stage-consensus
          fi
