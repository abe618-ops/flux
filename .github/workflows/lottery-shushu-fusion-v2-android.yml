name: Lottery Shushu Fusion V2 Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lottery-shushu-fusion-v2
    paths:
      - 'lottery-shushu-fusion-v2/**'
      - '.github/workflows/lottery-shushu-fusion-v2-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p lottery-shushu-fusion-v2 assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="lottery-shushu-fusion-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.abe618.lotteryshushu.v2'" /tmp/badging.txt
          mkdir -p dist/lottery-shushu-fusion-v2
          cp "$APK" dist/lottery-shushu-fusion-v2/Lottery-Shushu-Fusion-v2.0.0-beta1.apk
          sha256sum dist/lottery-shushu-fusion-v2/Lottery-Shushu-Fusion-v2.0.0-beta1.apk             > dist/lottery-shushu-fusion-v2/Lottery-Shushu-Fusion-v2.0.0-beta1.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lottery-Shushu-Fusion-v2.0.0-beta1
          path: |
            dist/lottery-shushu-fusion-v2/Lottery-Shushu-Fusion-v2.0.0-beta1.apk
            dist/lottery-shushu-fusion-v2/Lottery-Shushu-Fusion-v2.0.0-beta1.apk.sha256
          if-no-files-found: error

      - name: Publish to branch dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/lottery-shushu-fusion-v2/
          if git diff --cached --quiet; then
            echo "No dist changes"
          else
            git commit -m "Build Lottery Shushu Fusion v2.0.0-beta1 [skip ci]"
            git push origin HEAD:feature/lottery-shushu-fusion-v2
          fi
