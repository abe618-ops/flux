name: Daily Flow Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'daily-flow/source.b64.*'
      - '.github/workflows/daily-flow-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Daily Flow source archive
        shell: bash
        run: |
          cat daily-flow/source.b64.* | tr -d '[:space:]' | base64 -d > /tmp/daily-flow-source.zip
          unzip -t /tmp/daily-flow-source.zip
          rm -rf /tmp/daily-flow-src
          mkdir -p /tmp/daily-flow-src
          unzip -q /tmp/daily-flow-source.zip -d /tmp/daily-flow-src
          PROJECT_DIR="/tmp/daily-flow-src/daily-flow"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          cp "$APK" /tmp/DailyFlow-v0.1.0-debug.apk
          sha256sum /tmp/DailyFlow-v0.1.0-debug.apk | tee /tmp/DailyFlow-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyFlow-v0.1.0-debug
          path: |
            /tmp/DailyFlow-v0.1.0-debug.apk
            /tmp/DailyFlow-SHA256.txt
          if-no-files-found: error
