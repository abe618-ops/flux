name: Ancient Omen Football Lab Checks
on:
  pull_request:
    paths:
      - 'ancient-omen-football-lab/**'
      - '.github/workflows/ancient-omen-football-ci.yml'
  push:
    branches:
      - 'research/ancient-omens-football-v1-20261017'
    paths:
      - 'ancient-omen-football-lab/**'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core probability and chart invariants
        run: node ancient-omen-football-lab/tests/test_core.cjs
      - name: V2 research modules and source dossiers
        run: node ancient-omen-football-lab/tests/test_v2.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and execute original Java engines
        run: |
          bash ancient-omen-football-lab/tools/run-legacy.sh serial:1080 > /tmp/legacy.json
          node -e "const r=require('/tmp/legacy.json');if(r.qimen.serial!==1080||!r.four_tracks.maya||!r.four_tracks.ifa||!r.fusion_bingzhan.raw)throw Error('legacy bridge incomplete');console.log('PASS: legacy Java engine JSON and 1080 serial')"
      - name: Package standalone offline research suite
        uses: actions/upload-artifact@v4
        with:
          name: ancient-omen-football-v2-offline
          path: ancient-omen-football-lab/
          if-no-files-found: error
          retention-days: 30
