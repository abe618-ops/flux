name: Build Fusion Lab v1.3 Install Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'fusion-lab-v13fix/**'
      - '.github/workflows/fusion-lab-v13fix-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore source bundle
        shell: bash
        run: |
          rm -rf /tmp/fusion-build
          mkdir -p /tmp/fusion-build
          base64 -d fusion-lab-v13fix/source.zip.b64 > /tmp/fusion-source.zip
          unzip -q /tmp/fusion-source.zip -d /tmp/fusion-build
          test -f /tmp/fusion-build/fusion_src/settings.gradle
          test -f /tmp/fusion-build/fusion_src/app/src/main/assets/app.js

      - name: Build debug APK
        working-directory: /tmp/fusion-build/fusion_src
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signature and alignment
        shell: bash
        run: |
          APK=/tmp/fusion-build/fusion_src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p dist
          cp /tmp/fusion-build/fusion_src/app/build/outputs/apk/debug/app-debug.apk              dist/FusionLab-v1.3-Qimen-Liuyao-installfix.apk
          sha256sum dist/FusionLab-v1.3-Qimen-Liuyao-installfix.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionLab-v1.3-Qimen-Liuyao-installfix
          path: dist/FusionLab-v1.3-Qimen-Liuyao-installfix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/FusionLab-v1.3-Qimen-Liuyao-installfix.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Fusion Lab v1.3 install-fix APK"
            git push origin HEAD:main
          fi
