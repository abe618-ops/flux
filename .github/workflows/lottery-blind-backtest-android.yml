name: Lottery Blind Backtest Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'lottery-blind-backtest/source.zip'
      - '.github/workflows/lottery-blind-backtest-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android project
        shell: bash
        run: |
          rm -rf /tmp/lottery-blind-backtest
          mkdir -p /tmp/lottery-blind-backtest
          unzip -q lottery-blind-backtest/source.zip -d /tmp/lottery-blind-backtest
          PROJECT_DIR="/tmp/lottery-blind-backtest/lottery-blind-backtest-src"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build validated offline history snapshot
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"
          SNAP=/tmp/lottery_database.json

          # Reproducible public history snapshot. Exact upstream commit/blob is recorded below.
          curl -fsSL --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/FanKang2021/LuckyDD/main/data/database.json" \
            -o "$SNAP"
          test -s "$SNAP"

          python3 - "$SNAP" "$ASSETS" <<'PY'
          import json, re, sys
          from pathlib import Path

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          db = json.loads(src.read_text(encoding="utf-8"))

          mapping = {
              "lottery_3d": ("3d_desc.txt", 3),
              "happy_8": ("kl8_desc.txt", 20),
              "arrangement_3": ("pl3_desc.txt", 3),
              "arrangement_5": ("pl5_desc.txt", 5),
          }

          normalized = {}
          for key, (fn, ncount) in mapping.items():
              rows = db.get(key) or []
              valid = []
              seen = set()
              for row in rows:
                  issue = str(row.get("id", "")).strip()
                  date = str(row.get("date", "")).strip()
                  nums = row.get("numbers")
                  if not issue or issue in seen:
                      continue
                  if not re.fullmatch(r"20\d\d-\d\d-\d\d", date):
                      continue
                  if not isinstance(nums, list) or len(nums) != ncount:
                      continue
                  try:
                      vals = [int(x) for x in nums]
                  except Exception:
                      continue
                  if key == "happy_8":
                      if len(set(vals)) != 20 or any(x < 1 or x > 80 for x in vals):
                          continue
                      ntext = [f"{x:02d}" for x in vals]
                  else:
                      if any(x < 0 or x > 9 for x in vals):
                          continue
                      ntext = [str(x) for x in vals]
                  seen.add(issue)
                  valid.append((date, issue, ntext))

              valid.sort(reverse=True)
              if len(valid) < 250:
                  raise SystemExit(f"{key}: only {len(valid)} validated rows")
              normalized[key] = valid
              with (out / fn).open("w", encoding="utf-8") as f:
                  for date, issue, nums in valid:
                      f.write(issue + " " + date + " " + " ".join(nums) + "\n")
              print(f"{key}: {len(valid)} rows, {valid[-1][0]} .. {valid[0][0]}")

          # Structural cross-check guaranteed by official game design:
          # same-issue P3 must equal first three digits of P5.
          p3 = {issue:(date,nums) for date,issue,nums in normalized["arrangement_3"]}
          p5 = {issue:(date,nums) for date,issue,nums in normalized["arrangement_5"]}
          common = sorted(set(p3) & set(p5), reverse=True)
          bad = []
          for issue in common:
              if p3[issue][0] != p5[issue][0] or p3[issue][1] != p5[issue][1][:3]:
                  bad.append(issue)
          if len(common) < 250 or bad:
              raise SystemExit(f"P3/P5 cross-check failed: common={len(common)}, bad={bad[:10]}")

          # Date monotonicity and basic issue sanity.
          for key, rows in normalized.items():
              if len({d for d,_,_ in rows}) < 240:
                  raise SystemExit(f"{key}: suspicious duplicate-date density")

          meta = [
              "snapshot_source=FanKang2021/LuckyDD:data/database.json",
              "snapshot_blob_sha=47e9f6f170678667396b17faed1cdee9adaf8f75",
              "snapshot_note=public-history-cache; rules independently verified against official CWL/Sporttery",
              f"fc3d_records={len(normalized['lottery_3d'])}",
              f"kl8_records={len(normalized['happy_8'])}",
              f"pl3_records={len(normalized['arrangement_3'])}",
              f"pl5_records={len(normalized['arrangement_5'])}",
              f"pl3_pl5_crosscheck={len(common)}",
          ]
          (out / "snapshot_meta.txt").write_text("\n".join(meta) + "\n", encoding="utf-8")
          print("\n".join(meta))
          PY

          python3 "$PROJECT_DIR/tools/check_data.py" "$ASSETS"
          echo "=== snapshot head ==="
          head -n 2 "$ASSETS/3d_desc.txt"
          head -n 2 "$ASSETS/kl8_desc.txt"
          head -n 2 "$ASSETS/pl3_desc.txt"
          head -n 2 "$ASSETS/pl5_desc.txt"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 15
          cp "$APK" /tmp/LotteryBlindBacktest-v1.0.0-debug.apk
          sha256sum /tmp/LotteryBlindBacktest-v1.0.0-debug.apk | tee /tmp/LotteryBlindBacktest-SHA256.txt

      - name: Publish APK in repository
        shell: bash
        run: |
          mkdir -p lottery-blind-backtest/dist
          cp /tmp/LotteryBlindBacktest-v1.0.0-debug.apk lottery-blind-backtest/dist/
          cp /tmp/LotteryBlindBacktest-SHA256.txt lottery-blind-backtest/dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery-blind-backtest/dist
          if ! git diff --cached --quiet; then
            git commit -m "Build LotteryBlindBacktest v1.0.0 APK [skip ci]"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotteryBlindBacktest-v1.0.0-debug
          path: |
            /tmp/LotteryBlindBacktest-v1.0.0-debug.apk
            /tmp/LotteryBlindBacktest-SHA256.txt
          if-no-files-found: error
