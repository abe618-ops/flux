name: build-shushu-football
on:
  push:
    paths:
      - 'shushu-football/**'
      - '.github/workflows/build-shushu-football.yml'
  pull_request:
    paths:
      - 'shushu-football/**'
      - '.github/workflows/build-shushu-football.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shushu-football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -10
      - run: gradle :app:assembleDebug --stacktrace
      - name: Verify signed APK and alignment
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "${SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "${SDK_ROOT}/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "${SDK_ROOT}/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 10
      - uses: actions/upload-artifact@v4
        with:
          name: Liuyao-Qin-Football-v2.0
          path: shushu-football/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
