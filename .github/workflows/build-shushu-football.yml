name: build-shushu-football
on:
  push:
    paths:
      - 'shushu-football/**'
      - '.github/workflows/build-shushu-football.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shushu-football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ShuShuFootball-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShuShuFootball-v0.1
          path: shushu-football/app/build/outputs/apk/debug/ShuShuFootball-v0.1.apk
          retention-days: 30
