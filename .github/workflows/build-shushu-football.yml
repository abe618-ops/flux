name: build-shushu-football
on:
  push:
    paths:
      - 'shushu-football/**'
      - '.github/workflows/build-shushu-football.yml'
  pull_request:
    paths:
      - 'shushu-football/**'
      - '.github/workflows/build-shushu-football.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shushu-football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK into repository
        if: github.event_name == 'push'
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/ShuShuFootball-v0.1.apk
          sha256sum releases/ShuShuFootball-v0.1.apk > releases/ShuShuFootball-v0.1.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          git diff --cached --quiet && exit 0
          git commit -m "Publish ShuShu Football v0.1 APK [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ShuShuFootball-v0.1
          path: shushu-football/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
