name: Build Flux WebOS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-extension-hub/**"
      - ".github/workflows/build-flux-webos.yml"

concurrency:
  group: flux-webos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build ARM64 debug APK
        working-directory: android-extension-hub
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-extension-hub/app/build/outputs/apk/debug/app-debug.apk Flux-WebOS-0.2.0-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Flux-WebOS-0.2.0-arm64-apk
          path: Flux-WebOS-0.2.0-arm64-debug.apk
          if-no-files-found: error
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flux-webos-v0.2.0"
          FILE="Flux-WebOS-0.2.0-arm64-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Flux WebOS v0.2.0" \
              --notes "ARM64 Android prototype with built-in Firefox Android extension market search and one-tap AMO installation. Manual XPI/Chrome ZIP import remains available under Advanced." \
              --prerelease
          fi
