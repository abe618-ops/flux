name: Build Flux WebOS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-extension-hub/**"
      - ".github/workflows/build-flux-webos.yml"

concurrency:
  group: flux-webos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-extension-hub
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-extension-hub/app/build/outputs/apk/debug/app-debug.apk Flux-WebOS-0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-WebOS-debug-apk
          path: Flux-WebOS-0.1.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flux-webos-v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Flux-WebOS-0.1.0-debug.apk --clobber
          else
            gh release create "$TAG" Flux-WebOS-0.1.0-debug.apk \
              --title "Flux WebOS v0.1.0" \
              --notes "First installable Flux WebOS Android prototype. GeckoView browser runtime, Extension Center, signed Gecko add-on management, Chrome/WebExtension ZIP compatibility inspection and persistent Flux package store." \
              --prerelease
          fi
