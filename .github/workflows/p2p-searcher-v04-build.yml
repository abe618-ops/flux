name: Build P2P Searcher v0.4

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'p2p-searcher-v04/**'
      - '.github/workflows/p2p-searcher-v04-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - name: Reassemble and verify source
        run: |
          cat p2p-searcher-v04/source.part* > source.b64
          base64 -d source.b64 > P2P-Searcher-Next-v0.4.0-source.zip
          echo "6912f664c3b6128796ca73e561a0bf1211fe1a4219077df272547ff09b940b80  P2P-Searcher-Next-v0.4.0-source.zip" | sha256sum -c -
          rm -rf p2p-build
          mkdir p2p-build
          unzip -q P2P-Searcher-Next-v0.4.0-source.zip -d p2p-build
          chmod +x p2p-build/build_manual.sh
      - name: Build and verify APK
        run: |
          cd p2p-build
          ANDROID_SDK_LOCAL="$ANDROID_HOME" ./build_manual.sh
      - name: Package outputs
        run: |
          cp p2p-build/RELEASE_NOTES_v0.4.0.md p2p-build/dist/
          cp P2P-Searcher-Next-v0.4.0-source.zip p2p-build/dist/
          sha256sum p2p-build/dist/P2P-Searcher-Next-Android-v0.4.0.apk > p2p-build/dist/P2P-Searcher-Next-Android-v0.4.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: P2P-Searcher-Next-v0.4.0
          path: p2p-build/dist/*
          if-no-files-found: error
