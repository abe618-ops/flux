name: Build Bingfa Qimen Android

on:
  push:
    branches:
      - "feat/bingfa-qimen-android"
    paths:
      - "bingfa-qimen-android/**"
      - ".github/workflows/bingfa-qimen-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: bingfa-qimen-android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bingfa-qimen-debug-apk
          path: bingfa-qimen-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
