name: Virtual Bet v1.6 Score HAFU Settlement

on:
  workflow_dispatch:
  push:
    branches:
      - feature/virtual-bet-score-hafu-settlement
    paths:
      - 'virtual-bet-v1.6.0/**'
      - '.github/workflows/virtual-bet-v1.6-score-hafu-settlement.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore v1.5 stable source
        shell: bash
        run: |
          cat virtual-bet-v1.5.0/source.b64.* | tr -d '[:space:]' | base64 -d > /tmp/virtual-bet-source.zip
          unzip -t /tmp/virtual-bet-source.zip
          mkdir -p /tmp/virtual-bet-src
          unzip -q /tmp/virtual-bet-source.zip -d /tmp/virtual-bet-src
          PROJECT_DIR="$(find /tmp/virtual-bet-src -maxdepth 1 -type d -name 'football-simulator-*' | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/FootballData.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/TicketStore.java"
          grep -q 'ResultJob' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Apply v1.6 gameplay and settlement patch
        shell: bash
        run: |
          cp virtual-bet-v1.6.0/patch/MainActivity.java "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/MainActivity.java"
          cp virtual-bet-v1.6.0/patch/FootballData.java "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/FootballData.java"
          cp virtual-bet-v1.6.0/patch/MarketMath.java "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/MarketMath.java"
          cp virtual-bet-v1.6.0/patch/DataClient.java "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/DataClient.java"
          sed -i -E "s/versionName '[^']+'/versionName '1.6.0-score-hafu-settlement'/" "$PROJECT_DIR/app/build.gradle"
          grep -q '"CRS"' "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/FootballData.java"
          grep -q '"HAFU"' "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/FootballData.java"
          grep -q '同步赛果并结算' "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/MainActivity.java"
          grep -q '保存并计算' "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/MainActivity.java"
          grep -q 'String preferred' "$PROJECT_DIR/app/src/main/java/com/matchday/virtualbet/DataClient.java"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee /tmp/SHA256.txt
          cp "$APK" /tmp/PankouTrainer-v1.6.0-score-hafu-settlement-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PankouTrainer-v1.6.0-score-hafu-settlement
          path: |
            /tmp/PankouTrainer-v1.6.0-score-hafu-settlement-debug.apk
            /tmp/SHA256.txt
          if-no-files-found: error
