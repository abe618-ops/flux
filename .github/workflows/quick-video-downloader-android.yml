name: QuickSave Video Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quick-video-downloader/source.b64.*'
      - 'quick-video-downloader/patches/**'
      - '.github/workflows/quick-video-downloader-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore base source
        shell: bash
        run: |
          cat quick-video-downloader/source.b64.* | tr -d '[:space:]' | base64 -d > /tmp/quick-video-base.zip
          unzip -t /tmp/quick-video-base.zip
          rm -rf /tmp/quick-video-src
          mkdir -p /tmp/quick-video-src
          unzip -q /tmp/quick-video-base.zip -d /tmp/quick-video-src
          PROJECT_DIR="/tmp/quick-video-src/quick-video-downloader"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply v0.3.4 patch
        shell: bash
        run: |
          python3 quick-video-downloader/patches/apply_v030.py
          test -f "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DouyinResolver.java"
          grep -q 'api5-normal-c-hl.amemv.com/aweme/v1/feed/' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DouyinResolver.java"
          grep -q 'aweme.snssdk.com/aweme/v1/feed/' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DouyinResolver.java"
          grep -q "applicationId 'com.abe.quickvideo.v034'" "$PROJECT_DIR/app/build.gradle"
          grep -q 'setDestinationInExternalFilesDir' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/MainActivity.java"
          grep -q 'MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          grep -q 'RELATIVE_PATH' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          grep -q 'DIRECTORY_DCIM' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          grep -q 'IS_PENDING' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          grep -q 'openDownloadedFile' "$PROJECT_DIR/app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          rm -f /tmp/quick-video-downloader-v0.3.4-source.zip
          (cd /tmp/quick-video-src && zip -qr /tmp/quick-video-downloader-v0.3.4-source.zip quick-video-downloader)
          unzip -t /tmp/quick-video-downloader-v0.3.4-source.zip

      - name: Best-effort probe reported Douyin share link
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          share = "https://v.douyin.com/gxKvuxhaSR8/"
          webua = "Mozilla/5.0 (Linux; Android 10; Pixel 4) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"
          appua = "com.ss.android.ugc.aweme/290101 (Linux; U; Android 10; zh_CN; Pixel 4; Build/QQ3A.200805.001)"
          req = urllib.request.Request(share, headers={"User-Agent": webua})
          with urllib.request.urlopen(req, timeout=12) as r:
              final = r.geturl()
              body = r.read(2000000).decode("utf-8", "ignore")
          seed = final + "\n" + body
          m = re.search(r"/(?:video|note|share/video)/(\d{10,})", seed)
          if not m:
              m = re.search(r"(?:aweme_id|modal_id)=([0-9]{10,})", seed)
          print("final_url=", final)
          print("aweme_id=", m.group(1) if m else "NOT_FOUND")
          if not m:
              raise SystemExit(2)
          aweme_id = m.group(1)
          hit = False
          for host in (
              "https://api5-normal-c-hl.amemv.com/aweme/v1/feed/",
              "https://aweme.snssdk.com/aweme/v1/feed/",
          ):
              try:
                  u = host + "?aweme_id=" + aweme_id + "&aid=1128"
                  q = urllib.request.Request(u, headers={"User-Agent": appua, "Accept": "application/json,*/*"})
                  with urllib.request.urlopen(q, timeout=10) as r:
                      data = json.loads(r.read().decode("utf-8", "ignore"))
                  arr = data.get("aweme_list") or []
                  item = next((x for x in arr if str(x.get("aweme_id") or x.get("id") or "") == aweme_id), None)
                  if item is None and len(arr) == 1:
                      item = arr[0]
                  if item:
                      v = item.get("video") or {}
                      print("feed_hit=", host, "bit_rate=", len(v.get("bit_rate") or []), "play_addr=", bool(v.get("play_addr")))
                      for idx, br_item in enumerate(v.get("bit_rate") or []):
                          pa = (br_item or {}).get("play_addr") or {}
                          print("stream_meta=", idx,
                                "is_h265=", (br_item or {}).get("is_h265"),
                                "codec_type=", (br_item or {}).get("codec_type"),
                                "gear_name=", (br_item or {}).get("gear_name"),
                                "quality_type=", (br_item or {}).get("quality_type"),
                                "width=", pa.get("width") or (br_item or {}).get("width"),
                                "height=", pa.get("height") or (br_item or {}).get("height"),
                                "bit_rate=", (br_item or {}).get("bit_rate"))
                      candidates = []
                      for br in v.get("bit_rate") or []:
                          addr = (br or {}).get("play_addr") or {}
                          candidates.extend(addr.get("url_list") or [])
                      for key in ("play_addr_h264", "play_addr", "download_addr", "play_addr_265"):
                          addr = v.get(key) or {}
                          urls = addr.get("url_list") or []
                          print("addr_meta=", key,
                                "present=", bool(addr),
                                "uri=", addr.get("uri"),
                                "url_count=", len(urls),
                                "first_url=", urls[0] if urls else "")
                          candidates.extend(urls)
                          uri = addr.get("uri")
                          if uri and not str(uri).startswith("http"):
                              candidates.append(
                                  "https://www.iesdouyin.com/aweme/v1/play/?video_id="
                                  + urllib.parse.quote(str(uri))
                                  + "&ratio=1080p&line=0&is_play_url=1&watermark=0&source=PackSourceEnum_PUBLISH"
                              )
                      seen = set()
                      for media in candidates:
                          if not isinstance(media, str) or not media.startswith("http") or media in seen:
                              continue
                          seen.add(media)
                          try:
                              mr = urllib.request.Request(
                                  media,
                                  headers={
                                      "User-Agent": appua,
                                      "Referer": "https://www.douyin.com/",
                                      "Accept": "video/*,*/*;q=0.8",
                                      "Range": "bytes=0-1",
                                  },
                              )
                              with urllib.request.urlopen(mr, timeout=12) as rr:
                                  ctype = rr.headers.get("Content-Type", "")
                                  final_media = rr.geturl()
                                  rr.read(2)
                              print("media_ok=", final_media, "content_type=", ctype)
                              open("/tmp/douyin-media-url.txt", "w").write(final_media)
                              hit = True
                              break
                          except Exception as e:
                              print("media_miss=", type(e).__name__, str(e)[:160])
                      if hit:
                          break
              except Exception as e:
                  print("feed_miss=", host, type(e).__name__, str(e)[:160])
          if not hit:
              raise SystemExit(3)
          PY

      - name: Diagnose reported Douyin media bytes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -s /tmp/douyin-media-url.txt ]; then
            echo "No media URL captured"
            exit 0
          fi
          MEDIA="$(cat /tmp/douyin-media-url.txt)"
          APPUA='com.ss.android.ugc.aweme/290101 (Linux; U; Android 10; zh_CN; Pixel 4; Build/QQ3A.200805.001; Cronet/TTNetVersion:5f9037be 2023-01-13 QuicVersion:4668bb42 2022-11-21)'
          BROWSERUA='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          curl -L --fail --retry 1 --max-time 40 -A "$APPUA" -e 'https://www.douyin.com/' "$MEDIA" -o /tmp/dy-appua.bin || true
          curl -L --fail --retry 1 --max-time 40 -A "$BROWSERUA" -e 'https://www.iesdouyin.com/' "$MEDIA" -o /tmp/dy-browserua.bin || true
          echo '--- sizes ---'
          ls -l /tmp/dy-*.bin 2>/dev/null || true
          echo '--- file types ---'
          file /tmp/dy-*.bin 2>/dev/null || true
          echo '--- first bytes ---'
          for x in /tmp/dy-*.bin; do [ -e "$x" ] || continue; echo "$x"; xxd -l 32 "$x"; done
          echo '--- candidate codec probes ---'
          python3 - <<'PY3'
          import json, re, urllib.request, urllib.parse, subprocess, pathlib, os
          share = "https://v.douyin.com/gxKvuxhaSR8/"
          webua = "Mozilla/5.0 (Linux; Android 10; Pixel 4) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"
          appua = "com.ss.android.ugc.aweme/290101 (Linux; U; Android 10; zh_CN; Pixel 4; Build/QQ3A.200805.001)"
          req=urllib.request.Request(share,headers={"User-Agent":webua})
          with urllib.request.urlopen(req,timeout=12) as r:
              final=r.geturl(); body=r.read(2000000).decode("utf-8","ignore")
          m=re.search(r"/(?:video|note|share/video)/(\d{10,})", final+"\n"+body)
          if not m: raise SystemExit(0)
          aid=m.group(1)
          q=urllib.request.Request("https://aweme.snssdk.com/aweme/v1/feed/?aweme_id="+aid+"&aid=1128",headers={"User-Agent":appua,"Accept":"application/json,*/*"})
          with urllib.request.urlopen(q,timeout=12) as r: data=json.loads(r.read().decode())
          item=(data.get("aweme_list") or [None])[0] or {}
          v=item.get("video") or {}
          groups=[]
          for key in ("play_addr_h264","play_addr","download_addr","play_addr_265"):
              addr=v.get(key) or {}
              for u in addr.get("url_list") or []:
                  groups.append((key,u))
              uri=addr.get("uri")
              if uri and not str(uri).startswith("http"):
                  groups.append((key+"_uri","https://www.iesdouyin.com/aweme/v1/play/?video_id="+urllib.parse.quote(str(uri))+"&ratio=1080p&line=0&is_play_url=1&watermark=0&source=PackSourceEnum_PUBLISH"))
          seen=set()
          for i,(key,u) in enumerate(groups):
              if u in seen: continue
              seen.add(u)
              try:
                  rq=urllib.request.Request(u,headers={"User-Agent":appua,"Referer":"https://www.douyin.com/","Accept":"video/*,*/*;q=0.8"})
                  with urllib.request.urlopen(rq,timeout=15) as rr:
                      b=rr.read(4_000_000)
                      finalu=rr.geturl()
                  hits=[x.decode() for x in (b"avc1",b"avc3",b"hvc1",b"hev1",b"av01",b"mp4a") if x in b]
                  print("candidate_codec=",key,"fourcc=",hits,"bytes=",len(b),"url=",finalu[:180])
              except Exception as e:
                  print("candidate_error=",key,type(e).__name__,str(e)[:120])
          PY3

          echo '--- codec markers ---'
          for x in /tmp/dy-*.bin; do
            [ -e "$x" ] || continue
            echo "$x"
            strings "$x" | grep -E -m 20 'avc1|avc3|hvc1|hev1|av01|mp4a|Opus|vp09' || true
          done
          echo '--- mp4 fourcc scan ---'
          python3 - <<'PY2'
          from pathlib import Path
          for p in (Path('/tmp/dy-appua.bin'), Path('/tmp/dy-browserua.bin')):
              if not p.exists(): continue
              b=p.read_bytes()
              hits=[]
              for sig in [b'avc1',b'avc3',b'hvc1',b'hev1',b'av01',b'vp09',b'mp4a',b'Opus']:
                  if sig in b: hits.append(sig.decode())
              print(p.name, 'fourcc=', hits, 'size=', len(b))
          PY2

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          cp "$APK" /tmp/QuickSaveVideo-v0.3.4-android.apk
          sha256sum /tmp/QuickSaveVideo-v0.3.4-android.apk | tee /tmp/QuickSaveVideo-v0.3.4-SHA256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSaveVideo-v0.3.4
          path: |
            /tmp/QuickSaveVideo-v0.3.4-android.apk
            /tmp/QuickSaveVideo-v0.3.4-SHA256.txt
            /tmp/quick-video-downloader-v0.3.4-source.zip
          if-no-files-found: error

      - name: Publish/update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="quick-video-v0.3.4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               /tmp/QuickSaveVideo-v0.3.4-android.apk               /tmp/QuickSaveVideo-v0.3.4-SHA256.txt               /tmp/quick-video-downloader-v0.3.4-source.zip               --clobber
          else
            gh release create "$TAG"               /tmp/QuickSaveVideo-v0.3.4-android.apk               /tmp/QuickSaveVideo-v0.3.4-SHA256.txt               /tmp/quick-video-downloader-v0.3.4-source.zip               --target "$GITHUB_SHA"               --title "快存视频 v0.3.4"               --notes "v0.3.4 相册直入：DownloadManager 只负责临时下载；完成后通过 MediaStore.Video 在 DCIM/快存视频 创建正式视频记录，以 IS_PENDING=1 写入完整 MP4，再置 0 发布并删除临时文件。保留 H.264/AVC 优先解析，针对 Android 16 及 realme/OPPO 相册可见性加强。"
          fi
