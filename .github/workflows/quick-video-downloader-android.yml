name: QuickSave Video Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quick-video-downloader/source.b64.*'
      - '.github/workflows/quick-video-downloader-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore v0.2.0 source archive
        shell: bash
        run: |
          cat quick-video-downloader/source.b64.* | tr -d '[:space:]' | base64 -d > /tmp/quick-video-downloader-source.zip
          unzip -t /tmp/quick-video-downloader-source.zip
          rm -rf /tmp/quick-video-src
          mkdir -p /tmp/quick-video-src
          unzip -q /tmp/quick-video-downloader-source.zip -d /tmp/quick-video-src
          PROJECT_DIR="/tmp/quick-video-src/quick-video-downloader"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply v0.2.2 media-library and Douyin Lite parser patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])

          main = root / "app/src/main/java/com/abe/quickvideo/MainActivity.java"
          s = main.read_text()
          s = s.replace(
              "等待分享或链接…\\n保存目录：Download/快存视频",
              "等待分享或链接…\\n保存目录：Movies/快存视频（自动加入本地视频）"
          )
          s = s.replace(
              'req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "快存视频/" + fileName);',
              '''req.allowScanningByMediaScanner();
                req.setDestinationInExternalPublicDir(Environment.DIRECTORY_MOVIES, "快存视频/" + fileName);'''
          )
          s = s.replace(
              'setStatus("已建立下载任务 #" + id + "\\n保存到 Download/快存视频", false);',
              'setStatus("已建立下载任务 #" + id + "\\n保存到 Movies/快存视频；完成后自动加入本地视频库", false);'
          )

          # v0.2.2: Douyin / Douyin Lite parser repair.
          # 1) Use an iPhone Safari UA because current iesdouyin share pages often
          #    expose usable page data only on the mobile Safari path.
          android_ua = "Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36"
          ios_ua = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1"
          s = s.replace(android_ua, ios_ua)

          # 2) Before generic parsing, try a Douyin-specific path:
          #    short-link redirect -> aweme_id -> iteminfo/share page -> direct CDN candidate.
          method_key = "resolveHttp(String originalUrl)"
          pos = s.find(method_key)
          if pos < 0:
              raise RuntimeError("resolveHttp(String originalUrl) not found")
          brace = s.find("{", pos)
          if brace < 0:
              raise RuntimeError("resolveHttp opening brace not found")
          inject = r'''
              if ("抖音".equals(detectPlatform(originalUrl))) {
                  ResolveResult douyin = resolveDouyinLite(originalUrl);
                  if (douyin != null) return douyin;
              }
          '''
          s = s[:brace + 1] + inject + s[brace + 1:]

          helpers = r'''

              private ResolveResult resolveDouyinLite(String originalUrl) {
                  final String iosUa = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1";
                  try {
                      Page landing = fetchFollowingRedirectsWith(originalUrl, iosUa, "");
                      String landingUrl = landing != null && landing.url != null ? landing.url : originalUrl;

                      String awemeId = extractToutiaoId(originalUrl + " " + landingUrl);
                      if ((awemeId == null || awemeId.isEmpty()) && landing != null && landing.body != null) {
                          awemeId = extractToutiaoId(landing.body);
                      }
                      if (awemeId == null || awemeId.isEmpty()) return null;

                      String[] targets = new String[] {
                          "https://www.iesdouyin.com/web/api/v2/aweme/iteminfo/?item_ids=" + awemeId,
                          "https://www.iesdouyin.com/share/video/" + awemeId + "/"
                      };

                      for (String target : targets) {
                          Page page = fetchFollowingRedirectsWith(target, iosUa, "");
                          if (page == null || page.body == null || page.body.isEmpty()) continue;

                          java.util.List<Candidate> candidates = collectCandidates(page.body, page.url);
                          for (Candidate candidate : candidates) {
                              if (candidate == null || candidate.url == null) continue;

                              // Prefer direct CDN URLs already present in the page/API payload.
                              // Keep the legacy playwm->play normalization as a compatibility fallback.
                              String mediaUrl = candidate.url
                                      .replace("/playwm/", "/play/")
                                      .replace("playwm", "play");

                              if (verifyMediaUrl(mediaUrl, page.url)) {
                                  String title = extractTitle(page.body);
                                  if (title == null || title.isEmpty()) title = "抖音_" + awemeId;
                                  return new ResolveResult(mediaUrl, page.url, title, "");
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }
          '''
          class_end = s.rfind("\n}")
          if class_end < 0:
              raise RuntimeError("MainActivity class closing brace not found")
          s = s[:class_end] + helpers + s[class_end:]

          main.write_text(s)

          receiver = root / "app/src/main/java/com/abe/quickvideo/DownloadCompleteReceiver.java"
          receiver.write_text(r'''package com.abe.quickvideo;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.media.MediaScannerConnection;
          import android.net.Uri;

          import java.io.File;

          public class DownloadCompleteReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || !DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(intent.getAction())) return;
                  long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                  if (id < 0) return;

                  DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
                  if (dm == null) return;

                  try (Cursor cursor = dm.query(new DownloadManager.Query().setFilterById(id))) {
                      if (cursor == null || !cursor.moveToFirst()) return;
                      int statusIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                      if (statusIndex < 0 || cursor.getInt(statusIndex) != DownloadManager.STATUS_SUCCESSFUL) return;

                      int uriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI);
                      if (uriIndex < 0) return;
                      String localUri = cursor.getString(uriIndex);
                      if (localUri == null || localUri.isEmpty()) return;

                      Uri uri = Uri.parse(localUri);
                      if ("file".equalsIgnoreCase(uri.getScheme())) {
                          String path = uri.getPath();
                          if (path != null && new File(path).exists()) {
                              MediaScannerConnection.scanFile(
                                  context.getApplicationContext(),
                                  new String[]{path},
                                  new String[]{"video/mp4"},
                                  null
                              );
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          ''')

          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          receiver_xml = '''
                  <receiver
                      android:name=".DownloadCompleteReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.DOWNLOAD_COMPLETE" />
                      </intent-filter>
                  </receiver>
          '''
          m = m.replace("    </application>", receiver_xml + "    </application>")
          manifest.write_text(m)

          gradle = root / "app/build.gradle"
          g = gradle.read_text()
          g = g.replace("applicationId 'com.abe.quickvideo.v1'", "applicationId 'com.abe.quickvideo.v022'")
          g = g.replace("versionCode 2", "versionCode 4")
          g = g.replace("versionName '0.2.0'", "versionName '0.2.2'")
          gradle.write_text(g)

          readme = root / "README.md"
          r = readme.read_text().replace("v0.2.0", "v0.2.2")
          r += """
          
          ## v0.2.2 媒体库修复
          - 默认保存到 Movies/快存视频/。
          - 下载完成后自动触发 MediaScannerConnection 媒体扫描。
          - 文件管理器的视频分类、本地视频和图库可更快发现下载文件。
          - 保留 DownloadManager 下载记录、通知和下载后自动关闭。
          - 使用独立 applicationId com.abe.quickvideo.v022，避免与旧版调试签名冲突。
          """
          readme.write_text(r)
          PY

          rm -f /tmp/quick-video-downloader-v0.2.2-source.zip
          (cd /tmp/quick-video-src && zip -qr /tmp/quick-video-downloader-v0.2.2-source.zip quick-video-downloader)
          unzip -t /tmp/quick-video-downloader-v0.2.2-source.zip

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          cp "$APK" /tmp/QuickSaveVideo-v0.2.2-android.apk
          sha256sum /tmp/QuickSaveVideo-v0.2.2-android.apk | tee /tmp/QuickSaveVideo-v0.2.2-SHA256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSaveVideo-v0.2.2
          path: |
            /tmp/QuickSaveVideo-v0.2.2-android.apk
            /tmp/QuickSaveVideo-v0.2.2-SHA256.txt
            /tmp/quick-video-downloader-v0.2.2-source.zip
          if-no-files-found: error

      - name: Publish/update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="quick-video-v0.2.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              /tmp/QuickSaveVideo-v0.2.2-android.apk \
              /tmp/QuickSaveVideo-v0.2.2-SHA256.txt \
              /tmp/quick-video-downloader-v0.2.2-source.zip \
              --clobber
          else
            gh release create "$TAG" \
              /tmp/QuickSaveVideo-v0.2.2-android.apk \
              /tmp/QuickSaveVideo-v0.2.2-SHA256.txt \
              /tmp/quick-video-downloader-v0.2.2-source.zip \
              --target "$GITHUB_SHA" \
              --title "快存视频 v0.2.2" \
              --notes "v0.2.2：保留 Movies/快存视频 与媒体扫描修复；新增抖音/抖音极速版专用解析链：iPhone UA、短链提取 aweme_id、iesdouyin iteminfo/share 双路径、直连 CDN 优先，并保留原通用网页/WebView 兜底。使用独立包名避免旧版安装冲突。"
          fi
