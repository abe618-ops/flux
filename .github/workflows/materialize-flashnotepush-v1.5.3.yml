name: Build FlashNotePush v1.5.3 public APK

on:
  push:
    branches:
      - flashnotepush-v1.5.3
    paths:
      - 'FlashNotePush/.binary/source/**'
      - 'FlashNotePush/src/**'
      - 'FlashNotePush/AndroidManifest.xml'
      - 'FlashNotePush/build.sh'
      - 'FlashNotePush/res/**'
      - '.github/workflows/materialize-flashnotepush-v1.5.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flashnotepush-v1.5.3

      - name: Restore and repair sanitized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flashnote-src
          mkdir -p /tmp/flashnote-src FlashNotePush/source
          cat FlashNotePush/.binary/source/part* | base64 -d > /tmp/staged-source.zip
          unzip -q /tmp/staged-source.zip -d /tmp/flashnote-src || true
          # The staged archive has one known damaged member. Replace it with the
          # verified public text source committed directly in this branch.
          cp FlashNotePush/src/com/mingyang/flashpush/ArticleExtractor.java /tmp/flashnote-src/src/com/mingyang/flashpush/ArticleExtractor.java
          cp FlashNotePush/AndroidManifest.xml /tmp/flashnote-src/AndroidManifest.xml
          cp FlashNotePush/build.sh /tmp/flashnote-src/build.sh
          cp -R FlashNotePush/res/. /tmp/flashnote-src/res/
          (cd /tmp/flashnote-src && zip -q -r "$GITHUB_WORKSPACE/FlashNotePush/source/FlashNotePush-public-v1.5.3.zip" . -x 'build/*' 'dist/*' '*.jks' '*.keystore')
          unzip -t FlashNotePush/source/FlashNotePush-public-v1.5.3.zip >/dev/null

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDKROOT"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.1'

      - name: Generate CI signing key and build APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/flashnote-ci.jks -storepass flashnotepush-ci-153 -keypass flashnotepush-ci-153 -alias flashnote -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=FlashNotePush Public Build, OU=GitHub Actions, O=FlashNotePush, C=CN'
          cd /tmp/flashnote-src
          export FLASHNOTE_KEYSTORE=/tmp/flashnote-ci.jks
          export FLASHNOTE_KEY_ALIAS=flashnote
          export FLASHNOTE_KEYSTORE_PASS=flashnotepush-ci-153
          export FLASHNOTE_KEY_PASS=flashnotepush-ci-153
          bash build.sh
          mkdir -p "$GITHUB_WORKSPACE/FlashNotePush/releases"
          cp dist/FlashNotePush-Web-v1.5.3.apk "$GITHUB_WORKSPACE/FlashNotePush/releases/FlashNotePush-Web-v1.5.3.apk"
          sha256sum "$GITHUB_WORKSPACE/FlashNotePush/releases/FlashNotePush-Web-v1.5.3.apk"

      - name: Commit public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FlashNotePush/releases/FlashNotePush-Web-v1.5.3.apk FlashNotePush/source/FlashNotePush-public-v1.5.3.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build FlashNotePush v1.5.3 public APK [skip ci]'
          git push origin HEAD:flashnotepush-v1.5.3
