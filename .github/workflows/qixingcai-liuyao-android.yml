name: Qixingcai Liuyao Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'qixingcai-liuyao/**'
      - '.github/workflows/qixingcai-liuyao-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build QXC APK
        run: gradle --no-daemon --stacktrace -p qixingcai-liuyao assembleDebug
      - name: Verify APK signature and Android package
        shell: bash
        run: |
          APK=qixingcai-liuyao/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 14
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          cp "$APK" /tmp/Qixingcai-Liuyao-V1.0-Android8-debug.apk
          sha256sum /tmp/Qixingcai-Liuyao-V1.0-Android8-debug.apk > /tmp/Qixingcai-Liuyao-V1.0-SHA256.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Qixingcai-Liuyao-V1.0-APK
          path: |
            /tmp/Qixingcai-Liuyao-V1.0-Android8-debug.apk
            /tmp/Qixingcai-Liuyao-V1.0-SHA256.txt
          if-no-files-found: error
