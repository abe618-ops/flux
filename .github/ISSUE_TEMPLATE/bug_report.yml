name: Bug report
description: 报告一个可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请列出最小复现步骤。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、操作系统、扩展版本和发送通道。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true

