plugins { id 'com.android.application' }

android {
    namespace 'com.abe.shushufootball'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abe.shushufootball.hexqin.v2'
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { implementation 'cn.6tail:lunar:1.7.7' }
