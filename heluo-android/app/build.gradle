plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abe618.heluo'
    compileSdk 35

    defaultConfig {
        applicationId "com.abe618.trinumberconsensus"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
