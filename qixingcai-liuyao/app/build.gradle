plugins { id 'com.android.application' }
android {
  namespace 'com.abe618.qixingcai'
  compileSdk 35
  defaultConfig {
    applicationId 'com.abe618.qixingcai.hexfusion.v1'
    minSdk 26
    targetSdk 32
    versionCode 100
    versionName '1.0.0'
