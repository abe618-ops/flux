plugins { id 'com.android.application' }

android {
    namespace 'com.abe618.dayanfootball'
    compileSdk 36

    defaultConfig {
        applicationId 'com.abe618.dayanfootball'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
