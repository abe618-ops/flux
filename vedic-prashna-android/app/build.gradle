plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abe.vedicprashna'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abe.vedicprashna'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    sourceSets {
        main.java.srcDirs += '../vendor/swisseph/src/main/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
