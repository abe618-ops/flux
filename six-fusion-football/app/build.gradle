plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abe618.sixfusionfootball'
    compileSdk 36

    defaultConfig {
        applicationId 'com.abe618.sixfusionfootball'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '2.0.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
